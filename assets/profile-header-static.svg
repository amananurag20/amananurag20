<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Aman Anurag — Senior Full Stack Engineer</title>
  <desc id="desc">Building across web, mobile, desktop, and AI. An animated engineering console illustrates those four capabilities. All text remains visible with motion disabled.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#14142c"/></linearGradient>
    <linearGradient id="ink" x1="40" y1="0" x2="465" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#72edf1"/><stop offset="1" stop-color="#b5b6ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#76eaf1"/><stop offset=".5" stop-color="#b5a4ff"/><stop offset="1" stop-color="#cbf79b"/></linearGradient>
  </defs>
  <style>
    .packet { animation: travel 6s ease-in-out infinite; }
    .p2 { animation-delay: -1.5s; } .p3 { animation-delay: -3s; } .p4 { animation-delay: -4.5s; }
    .cursor { animation: cursor 3s ease-in-out infinite; }
    @keyframes travel { 0%,12% { transform: translateX(0); opacity:.3; } 72%,85% { transform:translateX(81px);opacity:1; } 100% { transform:translateX(81px);opacity:.3; } }
    @keyframes cursor { 0%,100% {opacity:.35} 50% {opacity:1} }
    @media (prefers-reduced-motion: reduce) { * {animation:none!important} }
  </style>
