    <text x="26" y="76" fill="#f0f5ff" font-size="29" font-weight="700" letter-spacing="-.8">DEVELOPER</text>
    <text x="26" y="109" fill="#83ebf2" font-size="29" font-weight="700" letter-spacing="-.8">DESK</text>
    <text x="26" y="143" fill="#b6c6df" font-size="15">Four devices. Real projects.</text>
    <text x="26" y="166" fill="#b6c6df" font-size="15">A 30-second guided tour.</text>
    <text x="26" y="197" fill="#d2f6fb" font-size="13" font-weight="700">ENTER THE 3D DESK ↗</text>
  </g>
  <g stroke="#587c9c" stroke-width="1.5"><path d="M313 69H367V103M434 69H385V103M313 171H367V137M434 171H385V137"/><path d="M367 120H385"/></g>
