<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Explore the 3D Developer Desk</title>
  <desc id="desc">Four devices connect to AI, mobile, desktop, and backend projects. Click this card for the interactive portfolio and guided tour.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="480" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#0c1524"/><stop offset="1" stop-color="#151731"/></linearGradient></defs>
  <style>.packet{animation:route 5s ease-in-out infinite}.second{animation-delay:-2.5s}@keyframes route{0%,10%{transform:translateY(0);opacity:.35}75%,100%{transform:translateY(69px);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect x=".5" y=".5" width="479" height="219" rx="16" fill="url(#bg)" stroke="#3a5874"/>
  <g font-family="Arial, Helvetica, sans-serif">
